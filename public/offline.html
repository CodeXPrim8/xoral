<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050308" />
    <title>Xoral Party — Offline</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #050308;
        color: #f7f1ea;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-family: Syne, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: -0.04em;
        margin: 0 0 0.6rem;
      }
      p { color: rgba(247, 241, 234, 0.62); max-width: 28rem; }
      a {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        background: linear-gradient(120deg, #fff 0%, #f3d48a 45%, #ff4da6 100%);
        color: #14010c;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>XORAL PARTY</h1>
      <p>You’re offline. Reconnect to get tickets, open the feed, and keep counting down to the night.</p>
      <a href="/party">Try again</a>
    </main>
  </body>
</html>
